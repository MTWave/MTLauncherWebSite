adius:8px;border:1px solid #2d3548}.grid{display:grid;grid-template-columns:1fr;gap:1.5rem}@media (min-width:768px){.grid{grid-template-columns:repeat(3,1fr)}}.button,button{display:inline-block;padding:.75rem 1.5rem;font-size:1rem;font-weight:700;line-height:1.5;text-align:center;white-space:nowrap;vertical-align:middle;cursor:pointer;user-select:none;background-color:#4ade80;border:1px solid #4ade80;color:#0f172a;border-radius:8px;transition:all .15s ease-in-out}.button:hover,button:hover{background-color:#3bc771;border-color:#3bc771;color:#0f172a}
