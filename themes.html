<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTLauncher — Конструктор Тем</title>
    <link rel="stylesheet" href="css/pico.min.css">
    <style>
        :root { --pico-primary: #4ade80; --pico-primary-hover: #3bc771; }
        body { display: flex; flex-direction: column; min-height: 100vh; justify-content: space-between; margin: 0; }
        header, footer { background: #1a1a1a; border-color: #2a2a2a; }
        footer .container { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: #707070; }
        footer a { color: #707070; margin-left: 15px; }
        footer a:hover { color: #fff; }

        .preview-window {
            border: 2px solid #333;
            border-radius: 8px;
            padding: 25px;
            transition: all 0.2s;
            text-align: center;
        }
        .preview-btn {
            font-weight: bold;
            transition: all 0.2s;
            cursor: pointer;
            display: inline-block;
            margin: 10px 0;
        }
        .preview-input {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
            font-size: 0.9rem;
            outline: none;
        }
        pre {
            background: #0f111a;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #23283d;
            font-size: 0.85rem;
            overflow-x: auto;
            text-align: left;
        }
    </style>
</head>
<body>

    <header>
        <nav class="container">
            <ul>
                <li><strong style="color: #4ade80;">MTLAUNCHER</strong></li>
            </ul>
            <ul>
                <li><a href="index.html" class="secondary">Главная</a></li>
                <li><a href="themes.html" style="color: #4ade80; border-bottom: 2px solid #4ade80;">Создать тему</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h2 style="text-align: center; margin-bottom: 2rem;">Онлайн редактор</h2>
        
        <div class="grid">
            <unknown>
                <h4 style="color: #4ade80;">Настройки цветов</h4>
                
                <label>Фон окна (QWidget):
                    <input type="color" id="bgColor" value="#000000">
                </label>
                
                <label>Цвет текста:
                    <input type="color" id="textColor" value="#ffffff">
                </label>
                
                <label>Фон кнопки (QPushButton):
                    <input type="color" id="btnBgColor" value="#800080">
                </label>
                
                <label>Рамка кнопки:
                    <input type="color" id="btnBorderColor" value="#ff0000">
                </label>

                <label>Рамка при наведении (Hover):
                    <input type="color" id="btnHoverBorderColor" value="#008000">
                </label>
                
                <label>Рамка поля ввода (QLineEdit):
                    <input type="color" id="inputBorderColor" value="#0000ff">
                </label>
                
                <label>Текст в поле ввода:
                    <input type="color" id="inputTextColor" value="#ff0000">
                </label>

                <button onclick="downloadQSS()" class="fluid" style="margin-top: 1rem;">💾 Скачать .qss файл</button>
            </unknown>

            <unknown>
                <h4 style="text-align: center;">Предпросмотр</h4>
                <div id="qtWindow" class="preview-window">
                    <p id="qtText">Пример текста интерфейса</p>
                    <button id="qtButton" class="preview-btn">Войти в игру</button>
                    <input id="qtInput" type="text" class="preview-input" value="Ваш Никнейм" readonly>
                </div>

                <h4 style="margin-top: 2rem; text-align: center;">Результирующий QSS-код</h4>
                <pre><code id="qssCode"></code></pre>
            </unknown>
        </div>
    </main>

    <footer>
        <div class="container">
            <div>© 2026 MTLauncher. Все права защищены.</div>
            <div>
                <a href="https://github.com/MTWave/MTLauncher" target="_blank">GitHub</a>
                <a href="https://codeberg.org/TechnoWave/TechnoLauncher" target="_blank">Codeberg</a>
            </div>
        </div>
    </footer>

    <script>
        const inputs = ['bgColor', 'textColor', 'btnBgColor', 'btnBorderColor', 'btnHoverBorderColor', 'inputBorderColor', 'inputTextColor'];
        
        const qtWindow = document.getElementById('qtWindow');
        const qtText = document.getElementById('qtText');
        const qtButton = document.getElementById('qtButton');
        const qtInput = document.getElementById('qtInput');
        const qssCodeBlock = document.getElementById('qssCode');

        function updateTheme() {
            const bg = document.getElementById('bgColor').value;
            const text = document.getElementById('textColor').value;
            const btnBg = document.getElementById('btnBgColor').value;
            const btnBorder = document.getElementById('btnBorderColor').value;
            const btnHover = document.getElementById('btnHoverBorderColor').value;
            const inputBorder = document.getElementById('inputBorderColor').value;
            const inputText = document.getElementById('inputTextColor').value;

            qtWindow.style.backgroundColor = bg;
            qtText.style.color = text;
            
            qtButton.style.backgroundColor = btnBg;
            qtButton.style.color = text;
            qtButton.style.border = `3px solid ${btnBorder}`;
            qtButton.style.borderRadius = '7px';
            qtButton.style.padding = '4px 8px';

            qtButton.onmouseenter = () => qtButton.style.borderColor = btnHover;
            qtButton.onmouseleave = () => qtButton.style.borderColor = btnBorder;

            qtInput.style.backgroundColor = bg;
            qtInput.style.border = `3px solid ${inputBorder}`;
            qtInput.style.borderRadius = '7px';
            qtInput.style.color = inputText;

            const qssTemplate = `QWidget {
    background-color: ${bg};
    color: ${text};
}
QPushButton {
    background-color: ${btnBg};
    color: ${text};
    border: 3px solid ${btnBorder};
    border-radius: 7px;
    padding: 4px 8px;
}
QLineEdit {
    border: 3px solid ${inputBorder};
    border-radius: 7px;
    color: ${inputText};
}

QPushButton:hover {
    border: 3px solid ${btnHover};
}`;

            qssCodeBlock.textContent = qssTemplate;
        }

        function downloadQSS() {
            const code = qssCodeBlock.textContent;
            const blob = new Blob([code], { type: 'text/plain' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'customtheme.qss';
            link.click();
            URL.revokeObjectURL(link.href);
        }

        inputs.forEach(id => {
            document.getElementById(id).addEventListener('input', updateTheme);
        });

        updateTheme();
    </script>
</body>
</html>
